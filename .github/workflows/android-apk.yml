# Сборка игры для Android (.apk, горизонтально, во весь экран) и выкладка в раздел «Releases».
# Веб-игра оборачивается в приложение Capacitor; подпись — постоянным ключом из mobile/debug.keystore,
# поэтому новая версия ставится поверх старой и сохранения остаются.
name: Android .apk

on:
  push:
    branches: [claude/vigilant-bell-o5g1lu, main, master]
    paths-ignore: ['**.md', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web files
        run: |
          rm -rf www && mkdir -p www/desktop
          cp -r index.html manifest.webmanifest css js fonts www/
          cp desktop/icon.png www/desktop/

      - name: Android project
        run: |
          npm i --no-save --no-audit --no-fund @capacitor/cli@8.5.3 @capacitor/core@8.5.3 @capacitor/android@8.5.3
          npx cap add android

      - name: Landscape, full screen, icon, splash, version
        run: |
          A=android/app/src/main
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"|' $A/AndroidManifest.xml
          grep -q sensorLandscape $A/AndroidManifest.xml
          cp mobile/MainActivity.java $A/java/io/github/abyzer1337/echoesofthefall/MainActivity.java
          rm -rf $A/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp desktop/icon.png $A/res/mipmap-$d/$n.png; done
          done
          for f in $A/res/drawable*/splash.png; do
            case "$f" in *port*) cp mobile/splash_port.png "$f" ;; *) cp mobile/splash_land.png "$f" ;; esac
          done
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          # подпись — всегда одним ключом (mobile/debug.keystore), иначе новая версия не встанет поверх старой
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  echoes {
                      storeFile file("../../mobile/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.echoes }
                  release { signingConfig signingConfigs.echoes }
              }
          }
          GRADLE
          npx cap sync android

      - name: Build .apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name it
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk EchoesOfTheFall.apk
          # проверка: подписано нашим ключом
          keytool -exportcert -keystore mobile/debug.keystore -storepass android -alias androiddebugkey > our.der
          python3 -c "import sys; a=open('EchoesOfTheFall.apk','rb').read(); c=open('our.der','rb').read(); sys.exit(0 if c in a else 'APK подписан не нашим ключом')"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfTheFall-Android
          path: EchoesOfTheFall.apk
          if-no-files-found: error

      - name: Publish download
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-build
          SHA=$(git rev-parse --short HEAD)
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          TITLE="Echoes of the Fall для Android"
          NOTES="Сборка из коммита $SHA.

          - **EchoesOfTheFall.apk** — скачай на телефон и открой. Android попросит разрешить установку из этого источника (браузера или «Файлов») — разреши.
          - Игра идёт горизонтально и во весь экран: слева джойстик, правым пальцем — оглядеться, справа — удар, «E», прыжок.
          - Новая версия ставится поверх старой, сохранения остаются."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest=false
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --latest=false
          fi
          gh release upload "$TAG" EchoesOfTheFall.apk --clobber
